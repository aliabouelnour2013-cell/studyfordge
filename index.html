<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STUDYFORGE OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sidebar { width: 250px; background: #020617; border-right: 1px solid #1e293b; height: 100vh; position: fixed; }
        .content { margin-left: 250px; padding: 40px; background: #020617; min-height: 100vh; color: white; }
        .nav-btn { width: 100%; padding: 15px; text-align: left; color: #94a3b8; cursor: pointer; border: none; background: none; font-weight: bold; }
        .nav-btn:hover { background: #1e293b; color: white; }
        .active-btn { color: #3b82f6; border-right: 4px solid #3b82f6; background: #0f172a; }
        .page-section { display: none; }
        .show { display: block !important; }
    </style>
</head>
<body style="margin:0; background:#020617;">

    <div class="sidebar">
        <div style="padding: 20px;">
            <h1 style="color: #3b82f6; font-size: 24px; font-weight: 900; font-style: italic;">STUDYFORGE</h1>
            <p style="color: #475569; font-size: 10px; font-weight: bold; letter-spacing: 2px;">BASE44 ELITE</p>
        </div>
        <button onclick="openTab('dash')" id="btn-dash" class="nav-btn active-btn">DASHBOARD</button>
        <button onclick="openTab('voice')" id="btn-voice" class="nav-btn">VOICE LAB</button>
        <button onclick="openTab('quiz')" id="btn-quiz" class="nav-btn">EXAM QUIZ</button>
    </div>

    <div class="content">
        
        <div id="dash" class="page-section show">
            <h2 style="font-size: 32px; font-weight: 900; margin-bottom: 20px;">COMMAND CENTER</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div style="background: #0f172a; padding: 20px; border-radius: 20px; border: 1px solid #1e293b;">
                    <p style="color: #64748b; font-size: 12px; font-weight: bold;">USER GPA</p>
                    <h3 style="font-size: 30px;">4.0</h3>
                </div>
                <div style="background: #0f172a; padding: 20px; border-radius: 20px; border: 1px solid #1e293b;">
                    <p style="color: #64748b; font-size: 12px; font-weight: bold;">READINESS</p>
                    <h3 style="font-size: 30px;">98%</h3>
                </div>
            </div>
        </div>

        <div id="voice" class="page-section">
            <h2 style="font-size: 32px; font-weight: 900; margin-bottom: 10px;">VOICE LAB</h2>
            <p style="color: #64748b; margin-bottom: 30px;">Filter background noise and remove stutters.</p>
            <button onclick="runAudio()" style="background: #2563eb; color: white; padding: 15px 30px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;">START RECORDING</button>
            <div id="voice-txt" style="margin-top: 30px; background: #000; padding: 20px; border-radius: 15px; color: #94a3b8; font-style: italic; border: 1px solid #1e293b;">
                Waiting for input...
            </div>
        </div>

        <div id="quiz" class="page-section">
            <h2 style="font-size: 32px; font-weight: 900; margin-bottom: 10px;">EXAM SIMULATOR</h2>
            <div style="background: #0f172a; padding: 30px; border-radius: 20px; border: 1px solid #1e293b;">
                <p style="font-size: 18px; margin-bottom: 20px;">A student holds a bag perfectly still. Is scientific "Work" being done?</p>
                <button onclick="this.innerText='Correct ✓'" style="display: block; width: 100%; text-align: left; padding: 15px; background: #1e293b; color: white; border: 1px solid #334155; border-radius: 10px; margin-bottom: 10px; cursor: pointer;">No, because displacement is zero.</button>
                <button onclick="this.innerText='Wrong ✗'" style="display: block; width: 100%; text-align: left; padding: 15px; background: #1e293b; color: white; border: 1px solid #334155; border-radius: 10px; cursor: pointer;">Yes, because the bag is heavy.</button>
            </div>
        </div>

    </div>

    <script>
        function openTab(tabId) {
            // Hide all pages
            var pages = document.getElementsByClassName('page-section');
            for (var i = 0; i < pages.length; i++) {
                pages[i].classList.remove('show');
            }
            // Show the clicked page
            document.getElementById(tabId).classList.add('show');

            // Update buttons
            var buttons = document.getElementsByClassName('nav-btn');
            for (var j = 0; j < buttons.length; j++) {
                buttons[j].classList.remove('active-btn');
            }
            document.getElementById('btn-' + tabId).classList.add('active-btn');
        }

        function runAudio() {
            var box = document.getElementById('voice-txt');
            box.innerText = "Processing audio... Removing fillers...";
            setTimeout(function() {
                box.innerText = "CLEANED: Newton's 2nd Law states F=ma. On the exam, remember that holding an object still is ZERO work.";
                box.style.color = "#3b82f6";
                box.style.fontStyle = "normal";
            }, 1500);
        }
    </script>
</body>
</html>
